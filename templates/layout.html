<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>@page.Title</title>
<style>
:root {
  --page-background: #f4f5f7;
  --surface: #ffffff;
  --text: #1b1f24;
  --text-muted: #52585f;
  --border: #c8cdd3;
  --accent: #1d4ed8;
  --accent-text: #ffffff;
  --danger: #b42318;
  --danger-text: #ffffff;
  --focus: #1d4ed8;
  --ok: #1a7f37;
  --radius: 8px;
}
@@media (prefers-color-scheme: dark) {
  :root {
    --page-background: #0f1216;
    --surface: #1a1f26;
    --text: #e8eaed;
    --text-muted: #a8afb8;
    --border: #3a424c;
    --accent: #7aa2ff;
    --accent-text: #0b1220;
    --danger: #ff8a80;
    --danger-text: #1a0605;
    --focus: #7aa2ff;
    --ok: #46d977;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page-background);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.5;
}
main {
  max-width: 44rem;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1.25rem;
}
h1 { font-size: 1.5rem; margin: 0 0 1rem; }
h2 { font-size: 1.15rem; margin: 0 0 0.75rem; }
p { margin: 0 0 0.75rem; }
.muted { color: var(--text-muted); }
dl { margin: 0 0 1rem; }
dt { color: var(--text-muted); font-size: 0.9rem; }
dd { margin: 0 0 0.6rem; overflow-wrap: anywhere; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 0.5rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
form { margin: 0; }
button {
  font: inherit;
  min-height: 2.75rem;
  padding: 0.5rem 1rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { border-color: var(--danger); color: var(--danger); }
button:hover { filter: brightness(0.95); }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; border: 1px solid var(--danger); color: var(--danger); font-size: 0.85rem; }
.site-head { max-width: 44rem; margin: 0 auto; padding: 1rem 1rem 0; display: flex; justify-content: flex-end; }
.site-head:empty { display: none; }
body:has(.account-page) main, body:has(.account-page) .site-head { max-width: 68rem; }
.session { display: flex; align-items: center; gap: 0.9rem; }
.session-user { color: var(--text-muted); }
.intro { margin: 0.5rem 0 1.5rem; }
.intro h1 { font-size: 2.25rem; margin-bottom: 0.75rem; }
.lead { font-size: 1.1rem; color: var(--text-muted); max-width: 38rem; }
.lead strong { color: var(--text); }
.account-columns { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
.account-columns .card { margin-bottom: 0; }
.linked-accounts { flex: 999 1 32rem; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem; }
.granted-access { flex: 1 1 18rem; min-width: 0; }
.card-head { grid-column: 1; }
.card-head h2, .granted-access h2 { margin: 0; }
.card-head p, .granted-access > p { margin: 0.35rem 0 1.25rem; }
.link-actions { grid-column: 2; grid-row: 1; align-self: start; display: flex; flex-direction: column; gap: 0.5rem; }
.row-list { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.account-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; padding: 1rem 1.25rem; }
.account-row + .account-row { border-top: 1px solid var(--border); }
.account-name { flex: 1 1 15rem; min-width: 0; }
.account-name .name { font-weight: 600; }
.user-name { overflow-wrap: anywhere; }
.account-state { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; }
.status { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.15rem 0.6rem; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
.status .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ok); }
.status-attention { border-color: var(--danger); color: var(--danger); }
.status-attention .dot { background: var(--danger); }
.grant-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
.grant { border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; align-items: flex-start; gap: 1rem; }
.grant h3 { margin: 0; font-size: 1.15rem; }
.grant dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.35rem 1rem; }
.grant dd { margin: 0; }
.empty { color: var(--text-muted); margin: 0; }
@@media (max-width: 40rem) {
  .session-user { display: none; }
  .linked-accounts { display: block; }
  .link-actions { margin-top: 1.25rem; }
  .link-actions button, .grant button { width: 100%; }
  .account-row { flex-direction: column; align-items: stretch; }
  .account-name { flex: none; }
  .account-state { justify-content: space-between; }
  .grant { align-items: stretch; }
}
</style>
</head>
<body>
<header class="site-head">@RenderHeader</header>
<main>
@RenderBody
</main>
</body>
</html>
